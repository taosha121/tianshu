[project]
name = "tsagent"
version = "0.3.0"
description = "A code agent built from scratch, no frameworks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai",
    "httpx",
    "python-dotenv",
    "PyYAML",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ts = "tianshu.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["tianshu"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
