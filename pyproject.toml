[project]
name = "tsagent"
version = "0.3.0"
description = "A code agent built from scratch, no frameworks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "httpx",
    "python-dotenv",
    "PyYAML",
    "pyfiglet",
]

[project.scripts]
ts = "tianshu.main:main"

[tool.hatch.build.targets.wheel]
packages = ["tianshu"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
