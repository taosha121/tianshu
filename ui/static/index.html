<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>tianshu dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: "72", Arial, sans-serif;
      background: #e8eaed;
    }

    /* ── Title bar ── */
    #titlebar {
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      background: #fff;
      border-bottom: 1px solid #d9d9d9;
    }
    #titlebar-text {
      font-size: 17px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 0.3px;
    }
    #titlebar-sep {
      color: #ccc;
      font-size: 15px;
    }
    #titlebar-project {
      font-size: 12px;
      color: #666;
      font-weight: 400;
    }
    #titlebar-project::before {
      content: "Current Project: ";
      color: #999;
    }

    /* ── Body ── */
    #body {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 1px;
      background: #d9d9d9;
      margin: 12px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,.10);
    }

    /* ── Left panel ── */
    #left-panel {
      width: 40%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    #chat-output {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 18px;
      font-family: "SF Mono", "Consolas", "Menlo", monospace;
      font-size: 13px;
      line-height: 1.7;
      color: #333;
      background: #f7f8f9;
    }
    #chat-output::-webkit-scrollbar { width: 5px; }
    #chat-output::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    .msg-user {
      color: #0070f2;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .msg-user::before { content: "> "; }
    .msg-event {
      color: #999;
      margin-bottom: 3px;
      padding-left: 10px;
      border-left: 2px solid #e0e0e0;
      font-size: 12px;
    }
    .msg-event.agent-created { color: #2e8b57; border-left-color: #2e8b57; }
    .msg-event.done { color: #888; border-left-color: #bbb; }
    .msg-agent {
      color: #1a1a1a;
      margin-bottom: 16px;
      white-space: pre-wrap;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      padding: 10px 12px;
      font-family: "72", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.7;
    }
    .msg-loading {
      display: flex;
      gap: 5px;
      padding: 10px 12px;
      margin-bottom: 16px;
      align-items: center;
    }
    .msg-loading span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #bbb;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .msg-loading span:nth-child(2) { animation-delay: 0.2s; }
    .msg-loading span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); background: #ccc; }
      40%            { transform: translateY(-6px); background: #888; }
    }

    #input-area {
      height: 140px;
      flex-shrink: 0;
      border-top: 1px solid #e0e0e0;
      background: #fff;
      padding: 10px 14px;
      display: flex;
    }

    #command-input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #1a1a1a;
      font-family: "SF Mono", "Consolas", "Menlo", monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      padding: 0;
    }
    #command-input::placeholder { color: #bbb; }

    /* ── Right panel ── */
    #right-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      background: #fff;
    }

    #canvas {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    #property-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #e0e0e0;
      background: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }
    #panel-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    #panel-title {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      flex: 1;
    }
    #panel-section-title {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 12px 16px 8px;
    }
    #panel-body {
      padding: 0 16px 16px;
      flex: 1;
      overflow-y: auto;
    }
    .prop-row { margin-bottom: 12px; }
    .prop-label {
      display: block;
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .prop-value {
      font-size: 12px;
      color: #333;
      background: #f7f8f9;
      border: 1px solid #e8e8e8;
      border-radius: 3px;
      padding: 6px 10px;
      display: block;
      word-break: break-all;
    }
    #prop-prompt {
      white-space: pre-wrap;
      font-family: "SF Mono", "Consolas", "Menlo", monospace;
      font-size: 12px;
      line-height: 1.5;
      min-height: 60px;
    }
    .prop-placeholder {
      font-size: 12px;
      color: #ccc;
      padding: 24px 0;
      text-align: center;
    }
  </style>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-async="true"
    data-sap-ui-oninit="module:app/main"
    data-sap-ui-libs="sap.m"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{
      "app": "app",
      "sap.galilei":     "node_modules/@sap/galilei/galilei/lib",
      "sap.galilei.ui5": "node_modules/@sap/galilei-ui5/galilei/lib/ui5"
    }'>
  </script>
</head>
<body class="sapUiBody">
  <div id="titlebar">
    <span id="titlebar-text">Tianshu Dashboard</span>
    <span id="titlebar-sep">/</span>
    <span id="titlebar-project"></span>
    <div style="flex:1"></div>
    <button id="test-links-btn" style="height:28px;padding:0 12px;background:#f0f0f0;color:#444;border:1px solid #d0d0d0;border-radius:4px;cursor:pointer;font-size:12px;">Test Links</button>
  </div>
  <div id="body">
    <div id="left-panel">
      <div id="chat-output"></div>
      <div id="input-area">
        <textarea id="command-input" placeholder="Enter a command, press Enter to send…" rows="3"></textarea>
      </div>
    </div>
    <div id="right-panel">
      <div id="canvas"></div>
      <div id="property-panel">
        <div id="panel-header">
          <span id="panel-title">Properties</span>
        </div>
        <div id="panel-section-title">Agent</div>
        <div id="panel-body">
          <div id="panel-placeholder" class="prop-placeholder">Select an agent to view properties</div>
          <div id="panel-props" style="display:none">
            <div class="prop-row">
              <span class="prop-label">ID</span>
              <span class="prop-value" id="prop-id"></span>
            </div>
            <div class="prop-row">
              <span class="prop-label">Type</span>
              <span class="prop-value" id="prop-type"></span>
            </div>
            <div class="prop-row">
              <span class="prop-label">Context</span>
              <span class="prop-value" id="prop-context">—</span>
            </div>
            <div class="prop-row">
              <span class="prop-label">Prompt</span>
              <pre class="prop-value" id="prop-prompt"></pre>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
