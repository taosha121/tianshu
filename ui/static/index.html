<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tianshu</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f5f6f7;
      --surface:     #ffffff;
      --border:      #e0e3e6;
      --border-light:#eceef0;
      --blue:        #0070f2;
      --blue-dim:    #e8f2ff;
      --green:       #107e3e;
      --green-dim:   #e6f4ec;
      --amber:       #e65100;
      --amber-dim:   #fff3e0;
      --red:         #bb0000;
      --red-dim:     #fff0f0;
      --text:        #1d2d3e;
      --text-2:      #556b82;
      --text-3:      #8396a8;
      --code-bg:     #f0f2f4;
      --radius:      8px;
      --radius-sm:   5px;
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "72", "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    #header {
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    #logo { display: flex; align-items: center; gap: 11px; }
    #logo-mark {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      background: linear-gradient(135deg, #0070f2 0%, #4aa3ff 100%);
      box-shadow: 0 2px 10px rgba(0,112,242,.35);
    }
    #logo-mark svg { fill: currentColor; }
    #header-title {
      font-size: 21px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: .3px;
    }
    #header-sep { color: var(--border); font-size: 18px; }
    #header-project { font-size: 12px; color: var(--text-2); }
    .spacer { flex: 1; }
    #ctx-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--text-2);
      opacity: 0;
      transition: opacity .3s;
    }
    #ctx-wrap.visible { opacity: 1; }
    #ctx-label { white-space: nowrap; }
    #ctx-bar-track {
      width: 80px;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    #ctx-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--blue);
      border-radius: 3px;
      transition: width .4s, background .4s;
    }
    #ctx-bar-fill.warn  { background: var(--amber); }
    #ctx-bar-fill.crit  { background: var(--red); }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background .2s;
      flex-shrink: 0;
    }
    #status-dot.running { background: var(--blue); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 0;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg-row {
      padding: 0 max(24px, calc(50% - 380px));
      margin-bottom: 6px;
    }

    /* User message */
    .msg-user .bubble {
      display: inline-block;
      max-width: 100%;
      background: var(--blue-dim);
      border: 1px solid #c5dcf9;
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-user { text-align: right; }

    /* Tool call block */
    .tool-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--text-3);
      border-radius: var(--radius-sm);
      overflow: hidden;
      font-family: "SF Mono", "Consolas", "Menlo", monospace;
      font-size: 12.5px;
    }
    .tool-block[data-status="done"] { border-left-color: var(--green); }
    .tool-block summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
      list-style: none;
      background: transparent;
    }
    .tool-block summary::-webkit-details-marker { display: none; }
    .tool-block[open] summary { background: var(--border-light); }
    .tool-name {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-2);
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .tool-arg {
      color: var(--text-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .tool-chevron {
      color: var(--text-3);
      font-size: 10px;
      flex-shrink: 0;
      transition: transform .15s;
    }
    .tool-block[open] .tool-chevron { transform: rotate(90deg); }
    .tool-result {
      padding: 8px 12px;
      border-top: 1px solid var(--border-light);
      color: var(--text-2);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 300px;
      overflow-y: auto;
      background: #fafbfc;
    }
    .tool-result::-webkit-scrollbar { width: 3px; }
    .tool-result::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Loading dots */
    .loading-dots {
      display: flex; gap: 5px; padding: 10px 0; align-items: center;
    }
    .loading-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--border);
      animation: ldot 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: .2s; }
    .loading-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes ldot {
      0%, 80%, 100% { transform: translateY(0); background: var(--border); }
      40%           { transform: translateY(-5px); background: var(--text-3); }
    }

    /* Agent response (Markdown) */
    .msg-agent .md-body {
      line-height: 1.7;
      color: var(--text);
    }
    .msg-agent .md-body p { margin: 0 0 .6em; }
    .msg-agent .md-body p:last-child { margin-bottom: 0; }
    .msg-agent .md-body h1,
    .msg-agent .md-body h2,
    .msg-agent .md-body h3 {
      font-weight: 600;
      margin: 1em 0 .4em;
      color: var(--text);
    }
    .msg-agent .md-body h1 { font-size: 1.2em; }
    .msg-agent .md-body h2 { font-size: 1.05em; }
    .msg-agent .md-body h3 { font-size: .95em; }
    .msg-agent .md-body ul,
    .msg-agent .md-body ol { padding-left: 1.4em; margin: .4em 0 .6em; }
    .msg-agent .md-body li { margin: .2em 0; }
    .msg-agent .md-body code {
      font-family: "SF Mono", "Consolas", "Menlo", monospace;
      font-size: .88em;
      background: var(--code-bg);
      padding: .1em .4em;
      border-radius: 3px;
      color: var(--amber);
    }
    .msg-agent .md-body pre {
      background: #1e2430;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      overflow-x: auto;
      margin: .6em 0;
    }
    .msg-agent .md-body pre code {
      background: none;
      padding: 0;
      color: #abb2bf;
      font-size: .85em;
    }
    .msg-agent .md-body blockquote {
      border-left: 3px solid var(--border);
      padding-left: 12px;
      color: var(--text-2);
      margin: .4em 0;
    }
    .msg-agent .md-body table {
      border-collapse: collapse;
      width: 100%;
      margin: .6em 0;
    }
    .msg-agent .md-body th,
    .msg-agent .md-body td {
      border: 1px solid var(--border);
      padding: 5px 10px;
      text-align: left;
    }
    .msg-agent .md-body th { background: var(--code-bg); font-weight: 600; }
    .msg-agent .md-body a { color: var(--blue); text-decoration: none; }
    .msg-agent .md-body a:hover { text-decoration: underline; }

    /* ── Input area ── */
    #input-wrap {
      flex-shrink: 0;
      padding: 12px max(24px, calc(50% - 380px));
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 13px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      line-height: 1.5;
      max-height: 160px;
      overflow-y: auto;
      transition: border-color .15s;
    }
    #input:focus { border-color: var(--blue); background: var(--surface); }
    #input::placeholder { color: var(--text-3); }
    #send-btn {
      height: 38px;
      padding: 0 16px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s, opacity .15s;
    }
    #send-btn:hover { background: #0060d1; }
    #send-btn:disabled { opacity: .45; cursor: default; }

    /* ── Permission modal ── */
    #perm-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #perm-overlay.active { display: flex; }
    #perm-dialog {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      width: 480px;
      max-width: 92vw;
      padding: 24px;
    }
    #perm-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text);
    }
    #perm-body {
      font-family: "SF Mono", "Consolas", monospace;
      font-size: 12.5px;
      background: var(--code-bg);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text-2);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 18px;
    }
    #perm-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .perm-btn {
      height: 34px; padding: 0 18px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    #perm-allow { background: var(--blue); color: #fff; border-color: var(--blue); }
    #perm-allow:hover { background: #0060d1; }
    #perm-deny  { background: var(--surface); color: var(--text); }
    #perm-deny:hover  { background: var(--bg); }
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div id="logo">
    <span id="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="23" height="23">
        <path d="M12 1.8 L15.1 8.9 L22.2 12 L15.1 15.1 L12 22.2 L8.9 15.1 L1.8 12 L8.9 8.9 Z"/>
      </svg>
    </span>
    <span id="header-title">Tianshu</span>
  </div>
  <span id="header-sep">·</span>
  <span id="header-project">—</span>
  <div class="spacer"></div>
  <div id="ctx-wrap">
    <span id="ctx-label">Ctx</span>
    <div id="ctx-bar-track"><div id="ctx-bar-fill"></div></div>
    <span id="ctx-pct">0%</span>
  </div>
  <div id="status-dot" title="idle"></div>
</div>

<!-- Chat -->
<div id="chat"></div>

<!-- Input -->
<div id="input-wrap">
  <textarea id="input" rows="1" placeholder="Type a command — Enter to send, Shift+Enter for a new line"></textarea>
  <button id="send-btn">Send</button>
</div>

<!-- Permission modal -->
<div id="perm-overlay">
  <div id="perm-dialog">
    <div id="perm-title">Permission required</div>
    <div id="perm-body"></div>
    <div id="perm-actions">
      <button class="perm-btn" id="perm-deny">Deny</button>
      <button class="perm-btn" id="perm-allow">Allow</button>
    </div>
  </div>
</div>

<script>
  const BACKEND = "";  // same origin
  const chat    = document.getElementById("chat");
  const input   = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const dot     = document.getElementById("status-dot");
  const ctxWrap = document.getElementById("ctx-wrap");
  const ctxFill = document.getElementById("ctx-bar-fill");
  const ctxPct  = document.getElementById("ctx-pct");

  let sessionId  = null;
  let activeEs   = null;
  let pendingPermRequestId = null;

  // track open tool-block elements by tc.id
  const toolBlockMap = {};

  // ── marked config ────────────────────────────────────────────────────
  marked.setOptions({ gfm: true, breaks: true });

  // ── Auto-resize textarea ─────────────────────────────────────────────
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  // ── Scroll helpers ───────────────────────────────────────────────────
  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  // ── DOM builders ────────────────────────────────────────────────────
  function addRow(cls, inner) {
    const row = document.createElement("div");
    row.className = "msg-row " + cls;
    row.appendChild(inner);
    chat.appendChild(row);
    scrollBottom();
    return row;
  }

  function addUserMsg(text) {
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    addRow("msg-user", b);
  }

  function addLoading() {
    const dots = document.createElement("div");
    dots.className = "loading-dots";
    dots.id = "loading";
    dots.innerHTML = "<span></span><span></span><span></span>";
    const row = addRow("msg-loading", dots);
    return row;
  }

  function removeLoading() {
    const el = document.getElementById("loading");
    if (el) el.closest(".msg-row")?.remove();
  }

  function addToolBlock(id, name, inp) {
    // key arg preview
    const KEY_ARG = {
      bash: "command", read_file: "path", write_file: "path",
      edit_file: "path", create_directory: "path", get_outline: "path",
      find_symbol: "name", grep_files: "pattern", list_files: "path",
      web_search: "query", web_fetch: "url",
      save_memory: "slug", delete_memory: "slug", read_memory: "slug",
    };
    const k = KEY_ARG[name];
    let argStr = k ? (inp[k] || "") : JSON.stringify(inp);
    if (argStr.length > 80) argStr = argStr.slice(0, 77) + "…";

    const details = document.createElement("details");
    details.className = "tool-block";
    details.innerHTML =
      `<summary>` +
        `<span class="tool-name">${esc(name)}</span>` +
        `<span class="tool-arg">${esc(argStr)}</span>` +
        `<span class="tool-chevron">▶</span>` +
      `</summary>` +
      `<div class="tool-result" id="tr-${esc(id)}">…</div>`;

    addRow("msg-tool", details);
    toolBlockMap[id] = details;
    return details;
  }

  function fillToolResult(id, result) {
    const details = toolBlockMap[id];
    if (!details) return;
    const tr = details.querySelector(".tool-result");
    if (tr) tr.textContent = result;
    details.setAttribute("data-status", "done");
  }

  function addAgentMsg(text) {
    const wrap = document.createElement("div");
    wrap.className = "md-body";
    wrap.innerHTML = marked.parse(text);
    addRow("msg-agent", wrap);
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ── Context bar ──────────────────────────────────────────────────────
  function updateCtx(ctx) {
    if (!ctx) return;
    const used  = ctx.estimatedTokens ?? ctx.estimatedChars ?? 0;
    const total = ctx.maxTokens ?? ctx.contextCharLimit ?? 1;
    const pct = Math.round(used / total * 100);
    ctxFill.style.width = Math.min(pct, 100) + "%";
    ctxFill.className = pct > 80 ? "crit" : pct > 50 ? "warn" : "";
    ctxPct.textContent = pct + "%";
    ctxWrap.classList.add("visible");
  }

  // ── Running state ────────────────────────────────────────────────────
  function setRunning(v) {
    dot.className = v ? "running" : "";
    sendBtn.disabled = v;
    input.disabled = v;
  }

  // ── Permission modal ─────────────────────────────────────────────────
  const permOverlay = document.getElementById("perm-overlay");
  const permBody    = document.getElementById("perm-body");

  function showPermission(requestId, tool, inp, reason) {
    pendingPermRequestId = requestId;
    const head = reason ? reason + "\n\n" : "";
    permBody.textContent = head + tool + "\n" + JSON.stringify(inp, null, 2);
    permOverlay.classList.add("active");
  }

  function hidePermission() {
    permOverlay.classList.remove("active");
    pendingPermRequestId = null;
  }

  async function respondPermission(allow) {
    if (!pendingPermRequestId) return;
    const rid = pendingPermRequestId;
    hidePermission();
    await fetch(`${BACKEND}/permission/${rid}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ allow }),
    }).catch(() => {});
  }

  document.getElementById("perm-allow").addEventListener("click", () => respondPermission(true));
  document.getElementById("perm-deny").addEventListener("click",  () => respondPermission(false));

  // ── SSE handler ──────────────────────────────────────────────────────
  function connectStream(runId) {
    const es = new EventSource(`${BACKEND}/stream/${runId}`);
    activeEs = es;

    es.onmessage = (e) => {
      const evt = JSON.parse(e.data);

      if (evt.type === "tool_call") {
        addToolBlock(evt.id, evt.name, evt.input || {});

      } else if (evt.type === "tool_result") {
        fillToolResult(evt.id, evt.result);

      } else if (evt.type === "prompt_updated" && evt.context) {
        updateCtx(evt.context);

      } else if (evt.type === "permission_request") {
        showPermission(evt.requestId, evt.tool, evt.input, evt.reason);

      } else if (evt.type === "result") {
        removeLoading();
        addAgentMsg(evt.text);

      } else if (evt.type === "done") {
        es.close(); activeEs = null;
        setRunning(false);
      }
    };

    es.onerror = () => {
      removeLoading();
      setRunning(false);
      es.close(); activeEs = null;
    };
  }

  // ── Submit ───────────────────────────────────────────────────────────
  async function submit() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    input.value = "";
    input.style.height = "auto";
    addUserMsg(text);
    addLoading();
    setRunning(true);

    try {
      const res = await fetch(`${BACKEND}/run`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: text, sessionId }),
      });
      const data = await res.json();
      sessionId = data.sessionId;
      connectStream(data.runId);
    } catch (err) {
      removeLoading();
      setRunning(false);
      console.error("submit failed:", err);
    }
  }

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  sendBtn.addEventListener("click", submit);

  // ── Init ─────────────────────────────────────────────────────────────
  fetch(`${BACKEND}/info`)
    .then(r => r.json())
    .then(d => { document.getElementById("header-project").textContent = d.project || d.cwd; })
    .catch(() => {});
</script>
</body>
</html>
